name: Labeler

# pull_request_target so forks get labels too. Safe because it never checks out or runs PR code;
# actions/labeler only reads the list of changed paths via the API.
on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true
