name: Release

# Builds the installers + updater artifacts (signed `latest.json`) for a tag and publishes the
# GitHub Release once every platform has finished. Started by version.yml when a merge to main
# carries a version that has no tag yet. To rebuild by hand: Actions -> Release -> Run workflow
# (tag = e.g. v0.12.0; the tag must exist).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.12.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # The release body is this version's section of CHANGELOG.md (written in the PR that bumped it).
      - name: Extract changelog section
        id: notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          body=$(sh .github/version.sh notes "${TAG#v}")
          if [ -z "$body" ]; then
            echo "::error::No '## ${TAG#v}' section in CHANGELOG.md"
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$body"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # older glibc for broader AppImage/deb compat
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # An unset secret is forwarded as an empty string, which makes the Tauri bundler fail late
      # with an obscure error — fail early and say why.
      - name: Check updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set. See README 'Auto-update signing key'."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Installers are not OS-code-signed or notarized (Windows SmartScreen / macOS Gatekeeper warn on
      # first run), but updates ARE verified: the updater artifacts are signed with the Tauri
      # minisign key and the app only installs updates matching the public key in tauri.conf.json.
      # The release stays a draft until the `publish` job, so installed apps never see a half-uploaded
      # latest.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: 'StudyLLM ${{ inputs.tag }}'
          releaseBody: |
            ${{ needs.notes.outputs.body }}

            ---
            Installers are unsigned — Windows SmartScreen and macOS Gatekeeper will warn before you
            can run them (see the README for how to proceed). Installed copies of the app update
            themselves, signature-verified.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Only after every platform uploaded its installer and updater entry: make the release public,
  # which is what the in-app updater (releases/latest/download/latest.json) sees.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
