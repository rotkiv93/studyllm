name: Release

# Builds the installers + updater artifacts (signed `latest.json`) and attaches them to the draft
# release that release-please created. Called from release-please.yml when a release PR is merged.
# Not triggered by tag pushes on purpose: publishing the draft creates the tag, which would build twice.
# To rebuild a release by hand: Actions -> Release -> Run workflow (tag = e.g. v0.7.0).
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.7.0
        required: true
        type: string
      sha:
        description: Commit to build (the release PR's merge commit)
        required: true
        type: string
      notes:
        description: Release notes body
        required: false
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.7.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # older glibc for broader AppImage/deb compat
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      # An unset secret is forwarded as an empty string, which makes the Tauri bundler fail late
      # with an obscure error — fail early and say why.
      - name: Check updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set. See README 'Auto-update signing key'."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Installers are not OS-code-signed or notarized (Windows SmartScreen / macOS Gatekeeper warn on
      # first run), but updates ARE verified: the updater artifacts are signed with the Tauri
      # minisign key and the app only installs updates matching the public key in tauri.conf.json.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: 'StudyLLM ${{ inputs.tag }}'
          releaseBody: |
            ${{ inputs.notes }}

            See the assets below to download and install this version for your OS. Installers are
            unsigned — Windows SmartScreen and macOS Gatekeeper will warn before you can run
            them. See the README for how to proceed anyway. Installed copies of the app update
            themselves (signature-verified) once this release is published.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
