name: CI

# PR only: main only ever receives PRs that already passed these checks, so re-running them on the
# merge commit (and on the bot-made release PR merge) just burns minutes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch/PR supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-typecheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Typecheck + build frontend
        run: npm run build

  rust-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libxdo-dev libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # Compiles the real desktop app on every OS we ship for, so Windows/macOS-only breakage shows
  # up on the PR instead of at release-tag time. Debug + no bundle keeps it fast; installers are
  # still only produced by release.yml.
  tauri-build:
    strategy:
      fail-fast: false
      matrix:
        # Linux is already compiled by rust-check (clippy) and again at release time.
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # `tauri build` refuses to run when a @tauri-apps/plugin-* npm package and its Rust crate are on
      # different major/minor versions (Dependabot bumps the two sides separately). `tauri info` prints
      # that as an error but still exits 0, so match its output.
      - name: Check Tauri npm/crate versions match
        shell: bash
        run: |
          out=$(npx tauri info 2>&1)
          echo "$out" | grep -iE "tauri-plugin|plugin-|mismatch" || true
          if echo "$out" | grep -qi "version mismatched"; then
            echo "::error::Tauri npm packages and Rust crates are on different versions. Bump the lagging side (e.g. npm install @tauri-apps/plugin-<name>@latest)."
            exit 1
          fi

      - name: Build desktop app (debug, no installer)
        run: npx tauri build --debug --no-bundle

  # Lints the workflow files themselves (syntax, expressions, shellcheck on run: blocks).
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
