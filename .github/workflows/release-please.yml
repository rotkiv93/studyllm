name: Release PR

# On every push to main, release-please reads the Conventional Commits since the last release and
# keeps a "chore(release): vX.Y.Z" PR open that bumps the version everywhere and writes the changelog.
# Merging that PR creates a DRAFT GitHub Release and builds the installers into it; publishing the
# draft (a manual click) is what ships the update to installed apps.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
      body: ${{ steps.rp.outputs.body }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please's "simple" release type can't bump the studyllm entry inside Cargo.lock, so the
  # release PR would leave it at the old version. Refresh it on the PR branch. (Pushes made with
  # GITHUB_TOKEN don't trigger other workflows, so this can't loop.)
  sync-cargo-lock:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Refresh studyllm version in Cargo.lock
        working-directory: src-tauri
        run: cargo update --workspace

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "Cargo.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore(release): sync Cargo.lock version"
          git push

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sha: ${{ needs.release-please.outputs.sha }}
      notes: ${{ needs.release-please.outputs.body }}
    secrets: inherit
    permissions:
      contents: write
